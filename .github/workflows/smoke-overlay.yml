name: Smoke test images
on:
  push:
    branches: [overlay-build]
    paths: ['.github/workflows/smoke-overlay.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/gitroomhq/postiz-app:v2.11.3
          - ghcr.io/siddhantprateek/postiz:v2.11.3-li.1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: postiz
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - name: Run image and wait for backend
        run: |
          set +e
          docker run -d --name pz --network host \
            -e DATABASE_URL=postgresql://postgres:pg@localhost:5432/postiz \
            -e REDIS_URL=redis://localhost:6379 -e JWT_SECRET=smoketestsecret \
            -e FRONTEND_URL=http://localhost:5000 -e MAIN_URL=http://localhost:5000 \
            -e NEXT_PUBLIC_BACKEND_URL=http://localhost:5000/api \
            -e BACKEND_INTERNAL_URL=http://localhost:3000 \
            -e IS_GENERAL=true -e NOT_SECURED=true -e RUN_CRON=true \
            -e STORAGE_PROVIDER=local -e UPLOAD_DIRECTORY=/uploads -e NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads \
            ${{ matrix.image }} > run.out 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(head -c 3000 run.out | tr '\n' '|')
            echo "::error title=docker run failed rc=$rc::$msg"
            exit 1
          fi
          up=no
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/user/self)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then up=yes; break; fi
            sleep 5
          done
          {
            echo "image=${{ matrix.image }} backend_up=$up after $((i*5))s"
            docker logs pz 2>&1 | grep -v -E 'Mapped|InstanceLoader|RoutesResolver' | tail -40
            echo "--- backend-error.log"
            docker exec pz sh -c 'tail -30 /root/.pm2/logs/backend-error.log 2>&1'
            echo "--- pm2"
            docker exec pz sh -c 'pm2 jlist 2>/dev/null | head -c 1200'
          } > out.txt 2>&1
          msg=$(head -c 6000 out.txt | tr '\n' '|')
          echo "::error title=smoke ${{ matrix.image }}::$msg"
